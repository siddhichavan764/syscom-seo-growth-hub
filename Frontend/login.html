<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Admin Login | Syscom SEO Growth Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1>Admin Login</h1>

            <p class="muted">
                Sign in to manage SEO growth activities.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="admin@syscom.co.in" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Login
                </button>

            </form>

            <p id="loginMessage" class="management-message">
            </p>

        </div>

    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
